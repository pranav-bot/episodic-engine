deployment: hybrid-local

storage:
  episode_log:
    driver: sqlite
    path: ~/.episodic-engine/episodes.db
  snapshots:
    driver: local
    path: ~/.episodic-engine/snapshots/

graphify:
  binary: graphify
  install_via: "uv tool install graphifyy"

init:
  marker_file: ~/.episodic-engine/.initialized
