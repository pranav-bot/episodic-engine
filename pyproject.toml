[project]
name = "episodic-engine"
version = "0.1.0"
description = "Episodic memory layer for graphify knowledge graphs"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
episodic = "episodic.cli.main:app"
episodic-mcp = "episodic.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/episodic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
